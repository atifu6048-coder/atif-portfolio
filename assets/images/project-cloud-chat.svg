<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Ambient background glow spheres -->
  <circle cx="200" cy="180" r="160" fill="#00f2fe" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="180" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Main App Frame -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="595" rx="16" fill="#0e1626" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Topbar -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 1064 0 A 16 16 0 0 1 1080 16 L 1080 50 L 0 50 Z" fill="#131c31"/>
    <circle cx="30" cy="25" r="6" fill="#ef4444"/>
    <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="25" r="6" fill="#10b981"/>
    <text x="540" y="30" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">DevPulse | Real-Time Collaborative Workspace &amp; Chat</text>
    
    <!-- Sidebar: Channels -->
    <rect x="0" y="50" width="220" height="545" fill="#0b1120" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="25" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700"># Channels</text>
    <rect x="15" y="105" width="190" height="34" rx="8" fill="rgba(0, 242, 254, 0.12)" stroke="rgba(0, 242, 254, 0.3)"/>
    <text x="35" y="127" fill="#00f2fe" font-family="sans-serif" font-size="13" font-weight="600"># engineering-core</text>
    <text x="35" y="165" fill="#64748b" font-family="sans-serif" font-size="13"># sprint-releases</text>
    <text x="35" y="200" fill="#64748b" font-family="sans-serif" font-size="13"># code-reviews</text>
    <text x="35" y="235" fill="#64748b" font-family="sans-serif" font-size="13"># microservices-api</text>

    <!-- User avatars in sidebar -->
    <text x="25" y="300" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Team Online (8)</text>
    <g transform="translate(25, 320)">
      <circle cx="14" cy="14" r="14" fill="#3b82f6"/>
      <circle cx="24" cy="24" r="4" fill="#10b981"/>
      <text x="40" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12">Atif (Lead Dev)</text>
    </g>
    <g transform="translate(25, 365)">
      <circle cx="14" cy="14" r="14" fill="#ec4899"/>
      <circle cx="24" cy="24" r="4" fill="#10b981"/>
      <text x="40" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12">Sarah (Frontend)</text>
    </g>
    <g transform="translate(25, 410)">
      <circle cx="14" cy="14" r="14" fill="#8b5cf6"/>
      <circle cx="24" cy="24" r="4" fill="#10b981"/>
      <text x="40" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12">DevOps Bot (Active)</text>
    </g>

    <!-- Center: Chat & Code collaboration pane -->
    <!-- Message 1 -->
    <g transform="translate(250, 75)">
      <circle cx="20" cy="20" r="18" fill="#3b82f6"/>
      <text x="20" y="25" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">A</text>
      <text x="50" y="18" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Atif (Full Stack Lead)</text>
      <text x="200" y="18" fill="#64748b" font-family="sans-serif" font-size="11">Today at 10:42 AM</text>
      <text x="50" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="13">Implemented WebSocket clusters and JWT session validation for the real-time pipeline:</text>
      
      <!-- Code Snippet Box -->
      <rect x="50" y="55" width="480" height="110" rx="8" fill="#080d1a" stroke="rgba(255,255,255,0.08)"/>
      <text x="70" y="80" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">io.on('connection', <tspan fill="#38bdf8">(socket)</tspan> =&gt; {</text>
      <text x="90" y="105" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12">  socket.join(roomId);</text>
      <text x="90" y="130" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12">  socket.broadcast.emit('user:joined', { userId });</text>
      <text x="70" y="150" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="12">});</text>
    </g>

    <!-- Message 2 -->
    <g transform="translate(250, 260)">
      <circle cx="20" cy="20" r="18" fill="#ec4899"/>
      <text x="20" y="25" fill="#fff" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">S</text>
      <text x="50" y="18" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Sarah Chen</text>
      <text x="140" y="18" fill="#64748b" font-family="sans-serif" font-size="11">Today at 10:45 AM</text>
      <text x="50" y="42" fill="#cbd5e1" font-family="sans-serif" font-size="13">Awesome latency! Verified sub-12ms ping on the WebSocket benchmark!</text>
    </g>

    <!-- Bottom input bar -->
    <g transform="translate(250, 520)">
      <rect width="520" height="48" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.12)"/>
      <text x="20" y="30" fill="#64748b" font-family="sans-serif" font-size="13">Write your message to #engineering-core...</text>
      <circle cx="490" cy="24" r="16" fill="url(#cyanGrad)"/>
      <polygon points="485,18 497,24 485,30" fill="#000"/>
    </g>

    <!-- Right Pane: Live Video / Audio & Stats -->
    <rect x="800" y="50" width="280" height="545" fill="#0c1222" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="825" y="85" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="700">Real-Time Metrics</text>

    <!-- Stat 1 -->
    <rect x="825" y="105" width="230" height="70" rx="10" fill="#131c31" stroke="rgba(0, 242, 254, 0.2)"/>
    <text x="840" y="130" fill="#94a3b8" font-family="sans-serif" font-size="11">WEBSOCKET LATENCY</text>
    <text x="840" y="160" fill="#00f2fe" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">11.4 ms</text>

    <!-- Stat 2 -->
    <rect x="825" y="190" width="230" height="70" rx="10" fill="#131c31" stroke="rgba(168, 85, 247, 0.2)"/>
    <text x="840" y="215" fill="#94a3b8" font-family="sans-serif" font-size="11">ACTIVE PEERS CONNECTED</text>
    <text x="840" y="245" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">2,840</text>

    <!-- Interactive Video Stream Mock -->
    <rect x="825" y="280" width="230" height="150" rx="10" fill="#17223b" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="940" cy="345" r="30" fill="url(#purpleGrad)" opacity="0.6"/>
    <text x="940" y="352" fill="#fff" font-family="sans-serif" font-size="18" text-anchor="middle" font-weight="bold">Live Call</text>
    <rect x="840" y="400" width="60" height="18" rx="4" fill="#ef4444"/>
    <text x="870" y="413" fill="#fff" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">REC • HD</text>
  </g>
</svg>
