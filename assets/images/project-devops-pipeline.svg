<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#02b375"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="devGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgDev)"/>
  <circle cx="950" cy="180" r="170" fill="#00ff9d" opacity="0.1" filter="url(#devGlow)"/>
  <circle cx="200" cy="520" r="160" fill="#38bdf8" opacity="0.12" filter="url(#devGlow)"/>

  <!-- Main Window -->
  <g transform="translate(60, 40)">
    <rect width="1080" height="595" rx="16" fill="#0c1220" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Header -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 1064 0 A 16 16 0 0 1 1080 16 L 1080 50 L 0 50 Z" fill="#11192c"/>
    <circle cx="30" cy="25" r="6" fill="#ef4444"/>
    <circle cx="50" cy="25" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="25" r="6" fill="#10b981"/>
    <text x="540" y="30" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="13" text-anchor="middle" font-weight="600">CloudMatrix | Kubernetes Clusters &amp; Automated CI/CD Pipeline</text>

    <!-- Top Pipeline Status Bar -->
    <rect x="30" y="70" width="1020" height="90" rx="12" fill="#131e35" stroke="rgba(0, 255, 157, 0.25)"/>
    <text x="55" y="105" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="700">Production Build #4029 - Main Branch</text>
    <rect x="55" y="120" width="80" height="22" rx="4" fill="rgba(0, 255, 157, 0.2)"/>
    <text x="95" y="135" fill="#00ff9d" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">DEPLOYED</text>
    
    <!-- Stage Nodes -->
    <!-- Stage 1 -->
    <g transform="translate(420, 95)">
      <circle cx="18" cy="18" r="14" fill="#00ff9d"/>
      <path d="M 12 18 L 16 22 L 24 14" stroke="#000" stroke-width="2.5" fill="none"/>
      <text x="40" y="16" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Code Lint &amp; Unit</text>
      <text x="40" y="30" fill="#64748b" font-family="sans-serif" font-size="10">24s • Passed</text>
    </g>
    <!-- Line -->
    <line x1="560" y1="113" x2="600" y2="113" stroke="#00ff9d" stroke-width="2"/>
    <!-- Stage 2 -->
    <g transform="translate(615, 95)">
      <circle cx="18" cy="18" r="14" fill="#00ff9d"/>
      <path d="M 12 18 L 16 22 L 24 14" stroke="#000" stroke-width="2.5" fill="none"/>
      <text x="40" y="16" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">Docker Image Build</text>
      <text x="40" y="30" fill="#64748b" font-family="sans-serif" font-size="10">1m 12s • Passed</text>
    </g>
    <!-- Line -->
    <line x1="770" y1="113" x2="810" y2="113" stroke="#00ff9d" stroke-width="2"/>
    <!-- Stage 3 -->
    <g transform="translate(825, 95)">
      <circle cx="18" cy="18" r="14" fill="#00ff9d"/>
      <path d="M 12 18 L 16 22 L 24 14" stroke="#000" stroke-width="2.5" fill="none"/>
      <text x="40" y="16" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="600">K8s Cluster Deploy</text>
      <text x="40" y="30" fill="#64748b" font-family="sans-serif" font-size="10">45s • Live</text>
    </g>

    <!-- Left: Cluster Pods Grid -->
    <rect x="30" y="180" width="580" height="390" rx="12" fill="#10182c" stroke="rgba(255,255,255,0.06)"/>
    <text x="55" y="215" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Microservice Cluster Architecture (12 Pods Active)</text>

    <!-- Pod 1 -->
    <rect x="55" y="235" width="250" height="95" rx="8" fill="#141f38" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="75" y="265" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">api-auth-service:v2.4</text>
    <text x="75" y="285" fill="#94a3b8" font-family="sans-serif" font-size="11">Replicas: 3/3 • CPU: 14%</text>
    <circle cx="275" cy="265" r="5" fill="#00ff9d"/>

    <!-- Pod 2 -->
    <rect x="330" y="235" width="250" height="95" rx="8" fill="#141f38" stroke="rgba(56, 189, 248, 0.3)"/>
    <text x="350" y="265" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="700">payment-worker:v1.9</text>
    <text x="350" y="285" fill="#94a3b8" font-family="sans-serif" font-size="11">Replicas: 4/4 • CPU: 22%</text>
    <circle cx="550" cy="265" r="5" fill="#00ff9d"/>

    <!-- Pod 3 -->
    <rect x="55" y="345" width="250" height="95" rx="8" fill="#141f38" stroke="rgba(168, 85, 247, 0.3)"/>
    <text x="75" y="375" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">graphql-gateway:v3.1</text>
    <text x="75" y="395" fill="#94a3b8" font-family="sans-serif" font-size="11">Replicas: 5/5 • CPU: 31%</text>
    <circle cx="275" cy="375" r="5" fill="#00ff9d"/>

    <!-- Pod 4 -->
    <rect x="330" y="345" width="250" height="95" rx="8" fill="#141f38" stroke="rgba(168, 85, 247, 0.3)"/>
    <text x="350" y="375" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="700">search-indexer:v2.0</text>
    <text x="350" y="395" fill="#94a3b8" font-family="sans-serif" font-size="11">Replicas: 2/2 • CPU: 9%</text>
    <circle cx="550" cy="375" r="5" fill="#00ff9d"/>

    <!-- Console Log stream -->
    <rect x="55" y="455" width="525" height="95" rx="8" fill="#070b14"/>
    <text x="70" y="480" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="11">[INFO] Pod k8s-eu-central-1 sync complete in 420ms</text>
    <text x="70" y="500" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">[HEALTH] Ingress load balancer traffic 0% packet loss</text>
    <text x="70" y="520" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">[TLS] Let's Encrypt automated certificate auto-renewed</text>

    <!-- Right: Telemetry & Traffic Chart -->
    <rect x="630" y="180" width="420" height="390" rx="12" fill="#10182c" stroke="rgba(255,255,255,0.06)"/>
    <text x="655" y="215" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">Cluster Traffic &amp; Uptime</text>

    <rect x="655" y="235" width="370" height="85" rx="8" fill="#141f38"/>
    <text x="675" y="260" fill="#94a3b8" font-family="sans-serif" font-size="11">AVERAGE REQUEST LATENCY</text>
    <text x="675" y="295" fill="#00ff9d" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">18.2 ms</text>
    <text x="880" y="295" fill="#38bdf8" font-family="sans-serif" font-size="14">99.99% SLA</text>

    <!-- Chart visualization -->
    <g transform="translate(655, 335)">
      <rect width="370" height="150" rx="8" fill="#080c18"/>
      <!-- Wave path -->
      <path d="M 10 120 Q 50 40 100 80 T 180 50 T 260 90 T 350 30" fill="none" stroke="url(#neonGreen)" stroke-width="3"/>
      <path d="M 10 120 Q 50 40 100 80 T 180 50 T 260 90 T 350 30 L 350 140 L 10 140 Z" fill="rgba(0, 255, 157, 0.08)"/>
      <circle cx="350" cy="30" r="5" fill="#00ff9d"/>
    </g>

    <text x="675" y="525" fill="#94a3b8" font-family="sans-serif" font-size="12">Global Edge Ingress: 4.8M req/min • 0 failed requests</text>
  </g>
</svg>
